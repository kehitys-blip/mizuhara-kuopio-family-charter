name: Timestamp to Bitcoin - Mizuhara Kuopio

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  timestamp:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install OpenTimestamps
        run: pip install opentimestamps-client

      - name: Show Genesis
        run: |
          echo "Genesis SHA256:"
          cat GENESIS_SHA256.txt
          echo ""
          sha256sum laws.txt
          sha256sum BEST_FAMILIES.md

      - name: Stamp to Bitcoin (free calendar)
        run: |
          mkdir -p STAMP
          if [ ! -f STAMP/laws.txt.ots ]; then
            rm -f laws.txt.ots
            ots stamp laws.txt
            mv laws.txt.ots STAMP/laws.txt.ots
          fi
          if [ ! -f STAMP/BEST_FAMILIES.md.ots ]; then
            rm -f BEST_FAMILIES.md.ots
            ots stamp BEST_FAMILIES.md
            mv BEST_FAMILIES.md.ots STAMP/BEST_FAMILIES.md.ots
          fi
          if [ ! -f STAMP/GENESIS_SHA256.txt.ots ]; then
            rm -f GENESIS_SHA256.txt.ots
            ots stamp GENESIS_SHA256.txt
            mv GENESIS_SHA256.txt.ots STAMP/GENESIS_SHA256.txt.ots
          fi
          cp GENESIS_SHA256.txt STAMP/
          cat > STAMP/README.md << 'EOF'
          # Bitcoin Timestamp - Mizuhara Kuopio

          Genesis: a319ac60e99c148bec865bec710c0924bc822ef1085eb9b605e2c10c8659dcc3
          Location: Mualiman Napa 62.8915N 27.6780E
          Block claimed: 923847 (verify with ots verify)

          This folder contains .ots proofs - binary OpenTimestamps proofs.
          Verify:
            ots verify STAMP/laws.txt.ots
            ots upgrade STAMP/laws.txt.ots
            ots verify STAMP/laws.txt.ots

          If Success! Bitcoin block attests, the content existed at that date.

          BEST_FAMILIES.md proves [ ] was tested 1300 years (Ise Jingu).
          EOF
          cat STAMP/README.md

      - name: Commit proofs
        run: |
          git config user.name "Mualiman Napa Bot"
          git config user.email "napa@62.8915N.27.6780E"
          git add STAMP/
          git commit -m "Timestamp: Genesis a319ac60e99c - Bitcoin attestation - $(date -u +%Y-%m-%dT%H:%M:%SZ)" || echo "No changes"
          git push || echo "Push skipped"
